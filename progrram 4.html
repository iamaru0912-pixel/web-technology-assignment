
<!DOCTYPE html>
<html>
<head>
    <title>College Event Gallery</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        .gallery {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1>College Event Gallery</h1>

    <div class="gallery">
        <figure>
            <img src="event1.jpg"
                 alt="Students performing on stage">
            <figcaption>College Cultural Event</figcaption>
        </figure>

        <figure>
            <img src="event2.jpg"
                 alt="Students receiving certificates">
            <figcaption>Prize Distribution</figcaption>
        </figure>

        <figure>
            <img src="event3.jpg"
                 alt="Students participating in a group dance">
            <figcaption>Dance Performance</figcaption>
        </figure>
    </div>

</body>
</html>
