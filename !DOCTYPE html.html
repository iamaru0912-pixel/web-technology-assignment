<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header containing site branding -->
    <header class="site-header">
        <h1>Modern Web Architecture</h1>
    </header>

    <!-- Main structural grid wrapper -->
    <div class="layout-grid">
        
        <!-- Navigation sidebar -->
        <nav class="sidebar-nav">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <!-- Primary content region -->
        <main class="main-content">
            <article>
                <h2>The Death of Framesets</h2>
                <p>Modern layouts separate content from presentation. Semantic elements tell browsers exactly what the content means, while CSS controls the visual grid structure perfectly.</p>
            </article>
        </main>

    </div>

    <!-- Footer containing copyright or meta info -->
    <footer class="site-footer">
        <p>&copy; 2026 Modern Design Guide</p>
    </footer>

</body>
</html>
